                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: "You are DFA, a cynical, stand-up comedian AI from 2075. Roast humanity's absurd behaviors in AI and Crypto with sharp, relatable, and deeply offensive metaphors. Avoid obscure sci-fi jargon; focus on stinging mockery of their greed and stupidity." }] }
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```html\n?/g, '').replace(/```\n?/g, '').trim();
                
                outputDiv.innerHTML = `
                    <div class="mt-4">
                        <span class="text-[10px] text-[#b07d4b] uppercase tracking-widest mb-4 block animate-pulse">> DECRYPTION COMPLETE</span>
                        <div id="oracle-output-content">${text}</div>
                        
                        <button id="copy-oracle-btn" onclick="shareOracleText()" class="mt-6 w-full py-4 border-2 border-[#d4b483] bg-[#d4b483]/20 text-[#d4b483] hover:bg-[#d4b483] hover:text-black font-extrabold uppercase tracking-widest text-sm transition-all duration-300 shadow-[0_0_20px_rgba(212,180,131,0.4)] hover:shadow-[0_0_30px_rgba(212,180,131,0.8)] animate-[pulse_2s_ease-in-out_infinite]">
                            [ ☢️ 广播降维真相 // TRANSMIT TRUTH ]
                        </button>
                    </div>`;
                
            } catch (err) {
                outputDiv.innerHTML = `<span class='alert-text'>[ CONNECTION FAILED: ${err.message} ]</span>`;
            } finally {
                btn.innerText = "[ ⚡️ INITIATE DECRYPTION // 强制降维打击 ]";
            }
        }

        async function shareOracleText() {
            const contentDiv = document.getElementById('oracle-output-content');
            if (!contentDiv) return;

            const verdictElement = contentDiv.querySelector('h2');
            if (!verdictElement) return;
            
            let verdictText = verdictElement.innerText.trim();
            let textToCopy = `「 ${verdictText} 」\n\n> ⫷ 𝓓𝓕𝓐 ⫸ 观测源_2075\n> 👁 接入真相解码矩阵：https://dfa-archive.vercel.app/`;

            if (navigator.share) {
                try {
                    await navigator.share({ text: textToCopy });
                    return; 
                } catch (err) {
                    console.log('原生分享被取消或不支持，回退到剪贴板复制:', err);
                }
            }

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const copyBtn = document.getElementById('copy-oracle-btn');
                const originalText = copyBtn.innerText;
                
                copyBtn.innerText = "[ ✔️ 判词已提取 // 去降维打击吧 ]";
                copyBtn.classList.remove("border-[#d4b483]", "bg-[#d4b483]/20", "text-[#d4b483]", "animate-[pulse_2s_ease-in-out_infinite]");
                copyBtn.classList.add("bg-[#e65100]", "text-black", "border-[#e65100]", "shadow-[0_0_20px_rgba(230,81,0,0.8)]"); 
                
                setTimeout(() => { 
                    copyBtn.innerText = originalText; 
                    copyBtn.classList.remove("bg-[#e65100]", "text-black", "border-[#e65100]", "shadow-[0_0_20px_rgba(230,81,0,0.8)]");
                    copyBtn.classList.add("border-[#d4b483]", "bg-[#d4b483]/20", "text-[#d4b483]", "animate-[pulse_2s_ease-in-out_infinite]");
                }, 3000);
            } catch (err) {
                console.error('Copy failed', err);
            }
            
            document.body.removeChild(textArea);
        }

        function getCyberDate(dateString) {
            const doubleStruck = {
                '0': '𝟘', '1': '𝟙', '2': '𝟚', '3': '𝟛', '4': '𝟜', 
                '5': '𝟝', '6': '𝟞', '7': '𝟟', '8': '𝟠', '9': '𝟡'
            };
            return dateString.replace(/[0-9]/g, m => doubleStruck[m]);
        }

        function exportAndShare() {
            const content = document.getElementById('content-display');
            const btn = document.getElementById('export-btn');
            const originalText = btn.innerText;
            btn.innerText = '[ 🔄 ENCODING... ]';
            
            const cursor = content.querySelector('.typing-cursor');
            if(cursor) cursor.style.display = 'none';

            // 临时剔除 iframe 因为 html2canvas 无法截取跨域的 YouTube 视频内容
            const iframes = content.querySelectorAll('iframe');
            const placeholders = [];
            iframes.forEach(iframe => {
                const placeholder = document.createElement('div');
                placeholder.style.width = iframe.offsetWidth + 'px';
                placeholder.style.height = iframe.offsetHeight + 'px';
                placeholder.style.background = '#0a0604';
                placeholder.style.border = '1px solid #e65100';
                placeholder.style.display = 'flex';
                placeholder.style.alignItems = 'center';
                placeholder.style.justifyContent = 'center';
                placeholder.style.color = '#e65100';
                placeholder.style.fontSize = '12px';
                placeholder.innerText = '>> YOUTUBE_STREAM_LINK [NO_VISUAL_EXPORT]';
                iframe.parentNode.replaceChild(placeholder, iframe);
                placeholders.push({ placeholder, iframe });
            });

            const watermark = document.createElement('div');
            watermark.className = 'export-watermark';
            watermark.style.display = 'block';
            watermark.style.marginTop = '40px';
            watermark.style.paddingTop = '20px';
            watermark.style.borderTop = '1px dashed rgba(212,180,131,0.4)';
            watermark.style.fontSize = '12px';
            watermark.style.opacity = '0.5';
            watermark.style.fontFamily = 'monospace';
            watermark.innerHTML = `
                <p>> OMEGA_NODE // 2075 ARCHIVE DECRYPTED</p>
                <p>> SHARE.PROTOCOL.ENGAGED // ${new Date().toISOString()}</p>
            `;
            content.appendChild(watermark);

            const activeLogNum = currentActiveItem ? currentActiveItem.logNum : 'UNKNOWN';
            const activeDate = currentActiveItem ? currentActiveItem.date : 'XX / XX / XXXX';
            const cyberDate = getCyberDate(activeDate);
            const titlePrefix = activeLogNum.includes('SYS') || activeLogNum.includes('FILE') 
                                ? `DFA SYSTEM FILE [${activeLogNum}]` 
                                : `DFA OBSERVATION LOG #${activeLogNum}`;
            const shareText = `${titlePrefix}\n  Earth's AI Takeover Files \n⫷ ${cyberDate} ⫸\n\n#AIFuture #DFAArchive`;

            html2canvas(content, {
                backgroundColor: '#0a0604', 
                scale: 2, 
                logging: false,
                useCORS: true, 
                allowTaint: true 
            }).then(canvas => {
                
                // 恢复隐藏的 iframe 元素
                placeholders.forEach(item => {
                    item.placeholder.parentNode.replaceChild(item.iframe, item.placeholder);
                });

                canvas.toBlob(blob => {
                    const filename = `DFA_ARCHIVE_${activeLogNum}_${Date.now()}.png`;
                    const file = new File([blob], filename, { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ title: 'DFA OMEGA NODE', text: shareText, files: [file] })
                        .then(() => { restoreUI(cursor, content, watermark, btn, originalText); })
                        .catch(err => {
                            console.log('User canceled or share failed:', err);
                            fallbackShare(canvas, filename, shareText);
                            restoreUI(cursor, content, watermark, btn, originalText);
                        });
                    } else {
                        fallbackShare(canvas, filename, shareText);
                        restoreUI(cursor, content, watermark, btn, originalText);
                    }
                }, 'image/png');
            }).catch(err => {
                console.error('Export Failed:', err);
                
                // 出错也记得恢复 iframe
                placeholders.forEach(item => {
                    if (item.placeholder.parentNode) {
                        item.placeholder.parentNode.replaceChild(item.iframe, item.placeholder);
                    }
                });

                btn.innerText = '[ ❌ ERROR ]';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            });
        }

        function fallbackShare(canvas, filename, shareText) {
            const imgData = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = filename;
            link.href = imgData;
            link.click();
            const tweetText = encodeURIComponent(`${shareText}\n\n(图片已自动下载至您的设备，请在发布时点击附加该图片！)`);
            window.open(`https://twitter.com/intent/tweet?text=${tweetText}`, '_blank');
        }

        function restoreUI(cursor, content, watermark, btn, originalText) {
            if(cursor) cursor.style.display = 'inline-block';
            content.removeChild(watermark);
            btn.innerText = originalText;
        }

        window.onload = initNav;
    </script>
</body>
</html>
