        function fallbackShare(canvas, filename, shareText) {
            const imgData = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = filename; link.href = imgData; link.click();
            const tweetText = encodeURIComponent(`${shareText}\n\n(图片已自动下载至您的设备，请在发布时点击附加该图片！)`);
            window.open(`https://twitter.com/intent/tweet?text=${tweetText}`, '_blank');
        }

        function restoreUI(cursor, content, watermark, btn, originalText) {
            if(cursor) cursor.style.display = 'inline-block';
            content.removeChild(watermark);
            btn.innerText = originalText;
        }

        window.loadContent = loadContent; window.decodeTruth = decodeTruth; window.shareOracleText = shareOracleText; window.exportAndShare = exportAndShare;

        window.onload = () => { initNav(); initFirebase(); };
    </script>
</body>
</html>
