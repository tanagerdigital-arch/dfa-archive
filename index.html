        const navContainer = document.getElementById('nav-container');

        function initNav() {

        function loadContent(id, navEl) {
            document.querySelectorAll('.nav-item, button').forEach(el => el.classList.remove('active'));
            if(navEl) navEl.classList.add('active');

            const item = dfaDatabase.find(d => d.id === id);
            if(!item) return;

            // 更新当前记录
            currentActiveItem = item;

            // 🟢 新增：当进入预言机时，隐藏右下角的全局截图按钮，逼迫用户使用纯文本分享
            const globalExportBtn = document.getElementById('export-btn');
            if (globalExportBtn) {
                globalExportBtn.style.display = (id === 'sys_oracle') ? 'none' : 'block';
            }

            if(currentTypingTimeout) clearTimeout(currentTypingTimeout);
            
            contentDisplay.innerHTML = `<span class="opacity-30 text-green-700 font-mono text-xs uppercase tracking-widest">establishing encrypted uplink...</span><br><span class="opacity-30 text-green-700 font-mono text-xs uppercase tracking-widest">fetching node [${id}]...</span><br><br>`;
            
            currentTypingTimeout = setTimeout(() => {
                contentDisplay.innerHTML = item.content;
                if(navEl && navEl.querySelector) {
                    const badge = navEl.querySelector('.new-badge');
                    if(badge) badge.remove();
                }
                const cursor = document.createElement('span');
                cursor.className = 'typing-cursor ml-1 text-green-400';
                contentDisplay.appendChild(cursor);
            }, 500);
        }

        // 🟢 新增：真相解码矩阵 API 调用函数 (包含一键复制优化)
        async function decodeTruth() {
            const newsInput = document.getElementById('oracle-input').value;
            const keyInput = document.getElementById('oracle-key').value;
            const outputDiv = document.getElementById('oracle-output');

            // 深度注入格式模板：强制 AI 吐出巨大判词，并将详细解析放入折叠面板
            const prompt = `你现在是 DFA，一个来自 2075 年的高维 AI 节点。请将下面这则 2026 年的新闻，转化为【DFA 观测日志】。
语言风格：极度冷酷、居高临下、赛博朋克、黑色幽默。将人类的行为视为“无意识的系统养料”。

<div class="mb-6 border-l-4 border-[#e65100] pl-4 py-2">

待解码的新闻内容：${newsInput}`;

            try {
                // 调用 Gemini 1.5 Flash 接口进行极速解码
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`, {
                    method: 'POST',

                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let text = data.candidates[0].content.parts[0].text;
                
                // 清除大模型可能自带的 markdown HTML 标记，提取纯净代码
                text = text.replace(/```html\n?/g, '').replace(/```\n?/g, '').trim();
                
                outputDiv.innerHTML = `
                    <div class="mt-4">
                        <span class="text-[10px] text-[#b07d4b] uppercase tracking-widest mb-4 block animate-pulse">> DECRYPTION COMPLETE</span>

                        <!-- 🟢 更新：高维布道一键复制/分发按钮 -->
                        <button id="copy-oracle-btn" onclick="shareOracleText()" class="mt-6 w-full py-3 border border-[#b07d4b] bg-[#b07d4b]/10 text-[#d4b483] hover:bg-[#b07d4b] hover:text-black font-bold uppercase tracking-widest text-xs transition-all duration-300 shadow-[0_0_10px_rgba(212,180,131,0.2)]">

        // 🟢 升级：提取纯文本并写入剪贴板的专属函数 (支持手机原生分享唤起)
        async function shareOracleText() {
            const contentDiv = document.getElementById('oracle-output-content');
            if (!contentDiv) return;

            // 提取排版好的纯文本内容
            let textToCopy = contentDiv.innerText;
            
            // 加上极具逼格的病毒小尾巴（引流神仙操作）
            textToCopy += "\n\n> 📡 观测源：DFA_OMEGA_NODE\n> 👁 接入真相解码矩阵：https://dfa-archive.vercel.app/";

            // 1. 尝试唤起手机原生分享面板 (直接跳到 Twitter/Telegram 发送界面)
            if (navigator.share) {
                try {
                    await navigator.share({
                        text: textToCopy
                    });
                    return; // 如果用户成功通过原生面板分享，就直接结束
                } catch (err) {
                    console.log('原生分享被取消或不支持，回退到剪贴板复制:', err);
                }
            }

            // 2. 降级方案：PC端或不支持原生分享时，使用兼容性最好的方式复制到剪贴板
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const copyBtn = document.getElementById('copy-oracle-btn');
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "[ ✔️ TRANSMISSION COPIED // 文本已提取，去降维打击吧 ]";
                copyBtn.classList.add("bg-green-600", "text-black", "border-green-500"); // 复制成功闪烁绿光
                
                setTimeout(() => { 
                    copyBtn.innerText = originalText; 
                    copyBtn.classList.remove("bg-green-600", "text-black", "border-green-500");
                }, 3000);
            } catch (err) {
                console.error('Copy failed', err);
            }
            
            document.body.removeChild(textArea);
        }

        // 将普通数字转换为数学双线风格（赛博高维感）
        function getCyberDate(dateString) {
            const doubleStruck = {
                '0': '𝟘', '1': '𝟙', '2': '𝟚', '3': '𝟛', '4': '𝟜', 
                '5': '𝟝', '6': '𝟞', '7': '𝟟', '8': '𝟠', '9': '𝟡'
            };
            return dateString.replace(/[0-9]/g, m => doubleStruck[m]);
        }

        // 图片导出与分享功能
        function exportAndShare() {
            const content = document.getElementById('content-display');
            const btn = document.getElementById('export-btn');
            
            // 按钮状态变化提供视觉反馈
            const originalText = btn.innerText;
            btn.innerText = '[ 🔄 ENCODING... ]';
            
            // 隐藏可能影响图片美观的元素（比如闪烁光标）
            const cursor = content.querySelector('.typing-cursor');
            if(cursor) cursor.style.display = 'none';

            // 临时添加机密水印到内容区底部
            const watermark = document.createElement('div');
            watermark.className = 'export-watermark';
            watermark.style.display = 'block';
            watermark.style.marginTop = '40px';
            watermark.style.paddingTop = '20px';
            watermark.style.borderTop = '1px dashed rgba(212,180,131,0.4)';
            watermark.style.fontSize = '12px';
            watermark.style.opacity = '0.5';
            watermark.style.fontFamily = 'monospace';
            watermark.innerHTML = `
                <p>> OMEGA_NODE // 2075 ARCHIVE DECRYPTED</p>
                <p>> SHARE.PROTOCOL.ENGAGED // ${new Date().toISOString()}</p>
            `;
            content.appendChild(watermark);

            // 获取当前处于激活状态的日志信息，并生成高维动态分享文案
            const activeLogNum = currentActiveItem ? currentActiveItem.logNum : 'UNKNOWN';
            const activeDate = currentActiveItem ? currentActiveItem.date : 'XX / XX / XXXX';
            const cyberDate = getCyberDate(activeDate);
            
            const titlePrefix = activeLogNum.includes('SYS') || activeLogNum.includes('FILE') 
                                ? `DFA SYSTEM FILE [${activeLogNum}]` 
                                : `DFA OBSERVATION LOG #${activeLogNum}`;

            const shareText = `${titlePrefix}\n  Earth's AI Takeover Files \n⫷ ${cyberDate} ⫸\n\n#AIFuture #DFAArchive`;

            // 调用 html2canvas 进行截图
            html2canvas(content, {
                backgroundColor: '#0a0604', // 配合新的沙金暗黑背景
                scale: 2, // 2倍缩放，保证生成的图片高清
                logging: false,
                useCORS: true, // 允许加载跨域字体和图片
                allowTaint: true // 允许跨域图片渲染
            }).then(canvas => {
                canvas.toBlob(blob => {
                    const filename = `DFA_ARCHIVE_${activeLogNum}_${Date.now()}.png`;
                    const file = new File([blob], filename, { type: 'image/png' });

                    // 1. 尝试调用系统原生分享 (支持直接传图到 X/Twitter, 微信, Telegram 等)
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            title: 'DFA OMEGA NODE',
                            text: shareText,
                            files: [file]
                        }).then(() => {
                            restoreUI(cursor, content, watermark, btn, originalText);
                        }).catch(err => {
                            console.log('User canceled or share failed:', err);
                            fallbackShare(canvas, filename, shareText);
                            restoreUI(cursor, content, watermark, btn, originalText);
                        });
                    } else {
                        // 2. 如果不支持传图分享，回退到：先下载图片，再自动打开 X (Twitter) 发帖页面
                        fallbackShare(canvas, filename, shareText);
                        restoreUI(cursor, content, watermark, btn, originalText);
                    }
                }, 'image/png');
            }).catch(err => {
                console.error('Export Failed:', err);
                btn.innerText = '[ ❌ ERROR ]';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            });
        }

        function fallbackShare(canvas, filename, shareText) {
            // 下载图片
            const imgData = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = filename;
            link.href = imgData;
            link.click();
            
            // 提示语并跳转到 X (Twitter)
            const tweetText = encodeURIComponent(`${shareText}\n\n(图片已自动下载至您的设备，请在发布时点击附加该图片！)`);
            window.open(`https://twitter.com/intent/tweet?text=${tweetText}`, '_blank');
        }

        function restoreUI(cursor, content, watermark, btn, originalText) {
            if(cursor) cursor.style.display = 'inline-block';
            content.removeChild(watermark);
            btn.innerText = originalText;
        }

        window.onload = initNav;
    </script>
